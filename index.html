<title>AI 专业生涯规划</title>
<style>
/* ================= 设计令牌(图表色遵循已验证参考调色板) ================= */
:root{
  --bg:#0d1120; --bg2:#101830; --card:#161b2e; --card2:#1b2240;
  --text:#f0efec; --muted:#c3c2b7; --faint:#898781;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --acc:#3987e5; --acc2:#9085e9; --acc-soft:rgba(57,135,229,.14);
  --up:#e66767; --down:#0ca30c;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --heat0:#1b2240; --heat1:#2a78d6;
  --shadow:0 6px 24px rgba(0,0,0,.25);
  --radius:14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  html:not([data-theme="dark"]){
    --bg:#f9f9f7; --bg2:#eef0f5; --card:#ffffff; --card2:#f6f8fd;
    --text:#0b0b0b; --muted:#52514e; --faint:#898781;
    --line:rgba(11,11,11,.10); --line2:rgba(11,11,11,.16);
    --acc:#2a78d6; --acc2:#6250d6; --acc-soft:rgba(42,120,214,.10);
    --up:#e34948; --down:#006300;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --heat0:#eef0f5; --heat1:#2a78d6;
    --shadow:0 6px 20px rgba(11,11,11,.08);
    color-scheme: light;
  }
}
html[data-theme="light"]{
  --bg:#f9f9f7; --bg2:#eef0f5; --card:#ffffff; --card2:#f6f8fd;
  --text:#0b0b0b; --muted:#52514e; --faint:#898781;
  --line:rgba(11,11,11,.10); --line2:rgba(11,11,11,.16);
  --acc:#2a78d6; --acc2:#6250d6; --acc-soft:rgba(42,120,214,.10);
  --up:#e34948; --down:#006300;
  --heat0:#eef0f5; --heat1:#2a78d6;
  --shadow:0 6px 20px rgba(11,11,11,.08);
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.6;
}
::selection{background:var(--acc);color:#fff}
a{color:var(--acc);text-decoration:none}
b{font-weight:650}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px}
.en{font-family:ui-monospace,Consolas,monospace;font-size:.86em;color:var(--muted)}
.up{color:var(--up)!important} .down{color:var(--down)!important}
.live{color:var(--down);font-size:12px;font-weight:600}
.live::before{content:"●";animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

/* ================= 布局 ================= */
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:230px;z-index:50;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px 20px max(14px, env(safe-area-inset-left, 0px));
}
.logo{display:flex;flex-direction:column;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo b{font-size:20px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--faint);font-size:11px;margin-top:2px}
#nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
#nav a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--muted);cursor:pointer;font-size:14.5px;border:1px solid transparent;user-select:none;
  transition:all .15s;
}
#nav a:hover{background:var(--card);color:var(--text)}
#nav a.active{background:var(--acc-soft);color:var(--text);border-color:var(--line2);font-weight:650}
#nav a.active .ni{transform:scale(1.12)}
.ni{font-size:17px;width:22px;text-align:center}
.nb{display:none;margin-left:auto;font-size:11px;background:var(--acc);color:#fff;border-radius:20px;padding:1px 7px}
.side-foot{padding:12px 6px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
#btnTheme{width:100%;margin-top:10px}

main{margin-left:230px;min-height:100vh;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:40;display:flex;align-items:center;gap:16px;
  padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
#topbar h1{font-size:21px;font-weight:700}
#topbar p{color:var(--muted);font-size:13.5px;flex:1}
#clock{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--faint)}
#content{flex:1;padding:24px 28px 40px;max-width:1240px;width:100%}
.page{display:none}
.page.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot-note{margin-top:18px;font-size:12.5px;color:var(--faint);line-height:1.7}

/* ================= 组件 ================= */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:18px;
}
.card-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;margin-bottom:14px;flex-wrap:wrap}
.card-t .btn{margin-left:auto}
.card-src{font-size:11.5px;color:var(--faint);font-weight:400}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;cursor:pointer;
  font-size:14px;font-family:inherit;border:1px solid transparent;transition:all .15s;user-select:none;
}
.btn.primary{background:var(--acc);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.ghost:hover{background:var(--card2)}
.btn.danger{background:var(--critical);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 28px;font-size:16px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:var(--card2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.mini{padding:0 7px;font-size:10.5px}
.tag.cat-tag{background:var(--acc-soft);border-color:transparent;color:var(--text);font-weight:600;margin-bottom:10px}
.hbar{height:8px;background:var(--card2);border-radius:10px;overflow:hidden;flex:1;min-width:60px}
.hbar-fill{height:100%;background:var(--acc);border-radius:10px;transition:width .4s}
.hbar-fill.warm{background:var(--up)} .hbar-fill.cool{background:var(--down)}
.hbar-sm{height:6px;max-width:130px}
.hbar-lg{height:12px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0;
}
.stat.clickable{cursor:pointer;transition:transform .15s}
.stat.clickable:hover{transform:translateY(-3px)}
.stat-ic{font-size:20px}
.stat-lab{font-size:12.5px;color:var(--muted)}
.stat-val{font-size:22px;font-weight:700;letter-spacing:.3px}
.stat-sub{font-size:12px;color:var(--faint)}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sel{
  background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:8px;
  padding:6px 10px;font-size:13px;font-family:inherit;margin-left:auto;
}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--faint);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--card2)}
.tbl tbody tr.sel{background:var(--acc-soft)}
.tbl tr.top3 td{background:color-mix(in srgb,var(--acc-soft) 60%,transparent)}
.tnum{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tbl-scroll{overflow-x:auto}
.sm-tbl td,.sm-tbl th{padding:6px 10px;font-size:12.5px}
.c-ic{margin-right:2px}
.match-cell{display:flex;align-items:center;gap:8px;min-width:170px}

/* ================= 总览页 ================= */
.hero{
  background:linear-gradient(120deg,var(--card) 30%,color-mix(in srgb,var(--acc) 16%,var(--card)));
  border:1px solid var(--line2);border-radius:var(--radius);padding:26px 28px;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow);
}
.hero-greet{font-size:23px;font-weight:750}
.hero-quote{color:var(--muted);margin-top:8px;font-size:14px}
.hero-fig{text-align:right;min-width:240px}
.hero-lab{font-size:12.5px;color:var(--muted)}
.hero-src{font-size:10.5px;color:var(--faint);border:1px solid var(--line2);border-radius:10px;padding:0 6px;margin-left:4px}
.hero-val{font-size:52px;font-weight:800;letter-spacing:1px;line-height:1.15;font-variant-numeric:proportional-nums}
.hero-delta{font-size:14px}
.dash-topic{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dash-topic:last-child{border-bottom:none}
.dt-rank{width:22px;height:22px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none}
.dt-name{font-size:14px;font-weight:600}
.dt-tag{font-size:11px;color:var(--faint)}
.dt-heat{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc)}
.dash-topic .hbar{max-width:90px;flex:none}
.rec-badge{
  display:inline-flex;align-items:center;gap:8px;background:var(--acc-soft);border:1px solid var(--line2);
  color:var(--text);font-weight:650;padding:7px 14px;border-radius:10px;margin-bottom:10px;cursor:pointer;
}
.rec-conf{font-size:12px;color:var(--muted);font-weight:400}
.rec-desc{color:var(--muted);font-size:14px;margin-bottom:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.qk{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
  transition:all .15s;box-shadow:var(--shadow);
}
.qk:hover{transform:translateY(-3px);border-color:var(--acc)}
.qk-ic{font-size:24px}
.qk b{display:block;margin:6px 0 2px}
.qk p{font-size:12px;color:var(--muted)}

/* ================= 测评/问卷 ================= */
.intro{text-align:center;padding:44px 24px;max-width:880px;margin:0 auto}
.intro-hero{font-size:56px}
.intro h2{margin:12px 0 10px;font-size:26px}
.intro-p{color:var(--muted);max-width:640px;margin:0 auto 24px}
.dim-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left}
.dim-ic{font-size:24px}
.dim-card b{display:block;margin:6px 0 4px}
.dim-card p{font-size:12.5px;color:var(--muted)}
.quiz-wrap{max-width:720px;margin:0 auto}
.quiz-prog{height:8px;background:var(--card2);border-radius:10px;overflow:hidden;margin-bottom:10px}
.quiz-prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:10px;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px;margin-bottom:14px}
.quiz-card{padding:30px}
.quiz-q{font-size:20px;margin-bottom:22px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{
  display:flex;align-items:center;gap:14px;text-align:left;padding:15px 18px;border-radius:12px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line2);color:var(--text);font-size:15px;font-family:inherit;
  transition:all .15s;
}
.quiz-opt:hover{border-color:var(--acc);transform:translateX(4px)}
.quiz-opt.picked{border-color:var(--acc);background:var(--acc-soft)}
.qo-key{
  width:28px;height:28px;border-radius:8px;background:var(--acc-soft);color:var(--acc);
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;
}
/* 结果 */
.res-hero{padding:26px}
.res-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.res-ic{font-size:52px}
.res-info{flex:1;min-width:260px}
.res-tag{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.res-info h2{font-size:26px}
.res-tagline{color:var(--muted);margin:6px 0 14px}
.res-actions{display:flex;gap:10px;flex-wrap:wrap}
.res-match{text-align:center;padding:4px 10px}
.rm-num{font-size:46px;font-weight:800;color:var(--acc);line-height:1}
.rm-num small{font-size:20px}
.rm-lab{color:var(--faint);font-size:12px}
.res-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:22px}
.res-desc p{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.res-rows div{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.res-rows div span{color:var(--muted);width:110px;flex:none}
.res-rows .inline{font-weight:700}
.res-rows .hbar{max-width:120px}
.res-card2{padding:18px}
.rc2-head{display:flex;align-items:center;gap:10px;font-size:15.5px}
.rc2-ic{font-size:22px}
.rc2-match{margin-left:auto;font-weight:800;color:var(--acc);font-size:18px}
.rc2-foot{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.why-list{list-style:none}
.why-list li{padding:7px 0 7px 24px;position:relative;border-bottom:1px solid var(--line);font-size:14px}
.why-list li::before{content:"▪";position:absolute;left:6px;color:var(--acc)}
.why-list.warn li::before{color:var(--warn)}
.myth{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card2)}
.myth summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
.myth summary::before{content:"❓ ";font-size:13px}
.myth p{padding:0 16px 14px;color:var(--muted);font-size:13.5px}

/* ================= 行业脉搏 ================= */
.mk-main{grid-template-columns:1.7fr 1fr}
.mk-chart-card{min-width:0}
.mk-range{display:flex;gap:4px;margin-left:auto}
.rg{padding:3px 10px;font-size:12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit}
.rg.active{background:var(--acc-soft);color:var(--text);border-color:var(--acc)}
.mk-price-line{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.mk-price{font-size:32px;font-weight:800;font-variant-numeric:proportional-nums}
#mk-chg{font-size:14px}
.cloud-item{display:inline-block;margin:6px 10px;color:var(--muted);cursor:default}
.cloud-item sup{font-size:9px;color:var(--faint)}
.hot-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hot-row:last-child{border-bottom:none}
.hot-main{flex:1;min-width:0}
.hot-name{font-size:13.5px;margin-bottom:4px}
.hot-right{text-align:right;font-size:14px;flex:none}
.hot-spark{display:block;margin-top:2px}

/* ================= 阶段规划 ================= */
.banner{
  background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  border-radius:12px;padding:12px 18px;margin-bottom:18px;font-size:14px;
}
.plan-sum{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.sum-left{display:flex;align-items:baseline;gap:10px;font-weight:700}
.sum-num{font-size:36px;font-weight:800;color:var(--acc)}
.sum-right{flex:1;min-width:220px}
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{
  position:absolute;left:-34px;top:16px;width:30px;height:30px;border-radius:50%;
  background:var(--card2);border:2px solid var(--line2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;
}
.tl-dot.done{background:var(--good);border-color:var(--good);color:#fff}
.tl-card{margin-bottom:0}
.tl-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.tl-title{font-size:13px;color:var(--acc);background:var(--acc-soft);padding:1px 10px;border-radius:20px}
.tl-prog{margin-left:auto;font-size:12px;color:var(--faint)}
.tl-goal{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.tl-tasks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.task{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;background:var(--card2);border:1px solid var(--line)}
.task:hover{border-color:var(--line2)}
.task input{width:16px;height:16px;margin-top:2px;accent-color:var(--acc);flex:none;cursor:pointer}
.task input:checked + span{text-decoration:line-through;color:var(--faint)}
.tl-comps{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.tl-tip{
  margin-top:12px;background:color-mix(in srgb,var(--warn) 10%,var(--card2));
  border:1px dashed color-mix(in srgb,var(--warn) 45%,transparent);border-radius:9px;
  padding:8px 13px;font-size:13px;
}

/* ================= 成长工具 ================= */
.heat-stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.heat-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.heat-week{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--faint)}
.heat-week span{height:13px;line-height:13px}
.heat-grid{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;gap:4px}
.heat-cell{width:13px;height:13px;border-radius:3.5px;background:var(--heat0);cursor:pointer;transition:transform .1s}
.heat-cell:hover{transform:scale(1.3)}
.heat-cell.on{background:var(--heat1)}
.heat-cell.today{outline:2px solid var(--acc);outline-offset:1px}
.heat-cell.fut{cursor:default;opacity:.4}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--faint)}
.heat-legend i{width:13px;height:13px;border-radius:3.5px;display:inline-block}
.hl0{background:var(--heat0)} .hl1{background:var(--heat1)}
.skill-top{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.ring{
  width:96px;height:96px;border-radius:50%;flex:none;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--card2) 0);
  display:flex;align-items:center;justify-content:center;
}
.ring span{
  width:74px;height:74px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.skill-cat{margin-bottom:18px}
.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.skill-node{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:14px}
.sn-name{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:14px}
.sn-lv{font-size:11px;color:var(--acc);background:var(--acc-soft);padding:1px 8px;border-radius:20px}
.sn-desc{font-size:12px;color:var(--muted);margin:6px 0 10px;min-height:34px}
.sn-dots{display:flex;gap:7px}
.sn-dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;transition:all .12s}
.sn-dots i.on{background:var(--acc);border-color:var(--acc)}
.sn-dots i:hover{transform:scale(1.3)}
.iv-prog{margin-left:auto;font-size:12.5px;color:var(--muted)}
.iv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.iv-card{perspective:1200px;height:230px;cursor:pointer}
.iv-card .iv-front,.iv-card .iv-back{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;padding:18px;
  border:1px solid var(--line2);background:var(--card2);transition:transform .45s;
  display:flex;flex-direction:column;
}
.iv-card{position:relative}
.iv-front{transform:rotateY(0)}
.iv-card.flip .iv-front{transform:rotateY(180deg)}
.iv-back{transform:rotateY(-180deg)}
.iv-card.flip .iv-back{transform:rotateY(0)}
.iv-cat{font-size:11px;color:var(--acc);background:var(--acc-soft);align-self:flex-start;padding:1px 9px;border-radius:20px;margin-bottom:10px}
.iv-front p{font-weight:650;font-size:14.5px;flex:1}
.iv-flip{font-size:11px;color:var(--faint);text-align:right}
.iv-hint{font-size:12.5px;color:var(--muted);flex:1;overflow-y:auto}
.iv-back .btn{align-self:flex-end;margin-top:10px}
.iv-card.mastered .iv-front{outline:2px solid var(--good);outline-offset:-2px}

/* ================= 资源库 ================= */
.res-cat{margin-bottom:20px}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.res-item{
  display:block;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  color:var(--text);transition:all .15s;position:relative;
}
.res-item:hover{border-color:var(--acc);transform:translateY(-2px)}
.res-item b{font-size:14.5px}
.res-item p{font-size:12.5px;color:var(--muted);margin-top:4px;padding-right:40px}
.res-go{position:absolute;top:14px;right:14px;font-size:12px;color:var(--acc)}
.comp-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.comp-row{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.comp-row:last-child{border-bottom:none}
.comp-month{font-weight:800;color:var(--acc);min-width:64px;font-size:14px}
.comp-info{flex:1;min-width:200px}
.comp-info p{font-size:12px;color:var(--faint)}

/* ================= 报告 ================= */
.report-actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.report-doc{
  background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);
  padding:40px 44px;max-width:820px;box-shadow:var(--shadow);
}
.rp-head{border-bottom:2px solid var(--line2);padding-bottom:16px;margin-bottom:20px}
.rp-head h1{font-size:24px}
.rp-head p{color:var(--faint);font-size:12.5px;margin-top:6px}
.rp-sec{margin-bottom:22px}
.rp-sec h2{font-size:16px;margin-bottom:10px;padding-left:10px;border-left:4px solid var(--acc)}
.rp-sec p,.rp-sec li{font-size:14px;color:var(--muted)}
.rp-sec ul{padding-left:20px;margin:6px 0}
.rp-sec b{color:var(--text)}
.rp-top3{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.rp-job{flex:1;min-width:200px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:14px;position:relative}
.rp-rank{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.rp-job b{margin-left:8px;color:var(--acc)}
.rp-job p{font-size:12.5px;margin-top:6px}
.rp-tip{font-size:13px;margin-top:8px;color:var(--muted)}
.rp-tip.warn{color:color-mix(in srgb,var(--warn) 80%,var(--text))}
.rp-foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* ================= 弹层 ================= */
#toast{
  position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px);
  background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:12px;
  padding:12px 20px;font-size:14px;box-shadow:var(--shadow);z-index:200;
  display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--good)} #toast.warn{border-color:var(--warn)} #toast.error{border-color:var(--critical)}
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;
}
#modal.show{display:flex}
.modal-card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:26px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal-card p{margin-bottom:20px;font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}
.chart-missing{padding:30px;text-align:center;color:var(--faint);font-size:13px}

/* ================= 响应式 ================= */
@media (max-width:1024px){
  .g4{grid-template-columns:1fr 1fr}
  .quick{grid-template-columns:1fr 1fr}
  .res-grid,.skill-grid,.iv-grid,.tl-tasks{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
}
@media (max-width:860px){
  #sidebar{position:static;width:100%;flex-direction:row;align-items:center;padding:10px;overflow-x:auto}
  #nav{flex-direction:row;overflow-x:auto}
  #nav a{white-space:nowrap}
  .logo{display:none}
  main{margin-left:0}
  .g2,.g3,.g4,.mk-main,.res-grid{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr 1fr}
  #content{padding:16px}
  #topbar{padding:12px 16px}
  .report-doc{padding:24px}
}

/* ================= 打印(仅报告页) ================= */
@media print{
  body *{visibility:hidden}
  #page-report,#page-report *{visibility:visible}
  #page-report{position:absolute;left:0;top:0;width:100%;background:#fff}
  .report-doc{border:none;box-shadow:none;max-width:none;color:#000;background:#fff}
  .no-print{display:none!important}
}
